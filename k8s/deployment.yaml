apiVersion: apps/v1
kind: Deployment
metadata:
  name: ejs-profile-viewer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ejs-profile-viewer
  template:
    metadata:
      labels:
        app: ejs-profile-viewer
    spec:
      containers:
        - name: ejs-profile-viewer
          image: yash7100/ejs-profile-viewer:latest
          ports:
            - containerPort: 3000
